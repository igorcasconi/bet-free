name: Daily Catalog Sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate APP_BASE_URL is HTTPS
        run: |
          case "${{ secrets.APP_BASE_URL }}" in
            https://*) ;;
            *) echo "APP_BASE_URL must start with https://" >&2; exit 1 ;;
          esac

      - name: Sync competitions
        run: |
          curl -f --max-time 120 --retry 2 --retry-delay 5 \
            -X POST "${{ secrets.APP_BASE_URL }}/api/sync/competitions" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"

      - name: Sync teams
        run: |
          curl -f --max-time 120 --retry 2 --retry-delay 5 \
            -X POST "${{ secrets.APP_BASE_URL }}/api/sync/teams" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"

      - name: Sync upcoming matches
        run: |
          curl -f --max-time 120 --retry 2 --retry-delay 5 \
            -X POST "${{ secrets.APP_BASE_URL }}/api/sync/matches" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
